services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: oci-osaka
    network_mode: host
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - iptables-nft -C INPUT -p udp --dport 41641 -j ACCEPT 2>/dev/null || iptables-nft -I INPUT 1 -p udp --dport 41641 -j ACCEPT; exec /usr/local/bin/containerboot
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_ACCEPT_DNS=false
      - TS_HOSTNAME=oci-osaka
      - TS_BOOT_TIMEOUT=30m
      - TS_TAILSCALED_EXTRA_ARGS=--port=41641
    volumes:
      - tailscale_state:/var/lib/tailscale
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --peers=false >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - com.centurylinklabs.watchtower.enable=true

volumes:
  tailscale_state:
